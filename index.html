<!DOCTYPE html>

<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MotoSim V0.2.0</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<h1>🏍️ MotoSim</h1>


<div id="status">
STATUS INIT
</div>



<div class="dashboard">


<div class="gauge">

<div class="title">
VITESSE
</div>

<div class="value">

<span id="speed">0</span>

<small>
km/h
</small>

</div>

</div>




<div class="gearBox">


<button id="minus">
-
</button>


<div id="gear">
N
</div>


<button id="plus">
+
</button>


</div>




<div class="gauge">


<div class="title">
RPM
</div>


<div class="value">

<span id="rpm">
1200
</span>

<small>
tr/min
</small>

</div>


</div>


</div>





<div class="controls">


<button id="brake">
BRAKE
</button>


<button id="gas">
GAZ
</button>


</div>




<div class="assist">


<button id="shiftUp" class="off">

🔴 SHIFTER UP OFF

</button>


<button id="shiftDown" class="off">

🔴 SHIFTER DOWN OFF

</button>


</div>




<div id="version">

MotoSim V0.2.0-a5-1

</div>



<script src="gearbox.js"></script>
<script src="transmission.js"></script>
<script src="enginePhysics.js"></script>
<script src="script.js"></script>


</body>

</html>
