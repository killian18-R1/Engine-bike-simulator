<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MotoSim</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<h1>🏍️ MotoSim</h1>


<div id="status">
STATUS : INIT
</div>



<div class="dashboard">


<div class="gauge">

<div class="label">
VITESSE
</div>

<div class="number">

<span id="speed">0</span>

<small>
km/h
</small>

</div>

</div>




<div class="gear-area">


<button id="minus" class="shift">
-
</button>


<div class="gear">

<span id="gear">
N
</span>

</div>


<button id="plus" class="shift">
+
</button>


</div>




<div class="gauge">

<div class="label">
RPM
</div>

<div class="number">

<span id="rpm">
1200
</span>

<small>
tr/min
</small>

</div>

</div>


</div>





<div class="controls">

<button id="brake">
BRAKE
</button>


<button id="gas">
GAZ
</button>

</div>




<div class="assist">


<button id="shiftUp" class="shifter-off">
🔴 SHIFTER UP OFF
</button>


<button id="shiftDown" class="shifter-off">
🔴 SHIFTER DOWN OFF
</button>


</div>




<div id="version">

MotoSim V0.2.0-a1

</div>


<script src="js/gameState.js"></script>
<script src="js/bikeLoader.js"></script>
<script src="js/engine.js"></script>
<script src="js/gearbox.js"></script>
<script src="js/physics.js"></script>
<script src="js/controls.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/utils.js"></script>
<script src="js/main.js"></script>


</body>

</html>
