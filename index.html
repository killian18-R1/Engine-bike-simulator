<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulateur Moto</title>

    <link rel="stylesheet" href="style.css">
</head>
<div id="version">
    MotoSim V0.0.0
</div>
    <body>

    <h1>🏍️ Simulateur Moto</h1>

    <div class="compteur">

        <div class="bloc">
            <h2>Vitesse</h2>
            <p><span id="vitesse">0</span> km/h</p>
        </div>

        <div class="bloc">
            <h2>Compte-tours</h2>
            <p><span id="rpm">1200</span> tr/min</p>
        </div>

        <div class="bloc">
            <h2>Rapport</h2>
            <p><span id="rapport">N</span></p>
        </div>

        <div class="bloc">
            <h2>Gaz</h2>
            <p><span id="gaz">OFF</span></p>
        </div>

        <div class="bloc">
            <h2>Frein</h2>
            <p><span id="frein">OFF</span></p>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
